# The service user that runs this tooling. Least privilege: no ACCOUNTADMIN, no secondary roles.
platform_user:
  name: PLATFORM_ADMIN
  roles: [SYSADMIN, SECURITYADMIN]
  default_role: SYSADMIN
  default_warehouse: WH_ADMIN

warehouses:
  WH_ADMIN:     {size: XSMALL, auto_suspend: 60, credit_quota: 10, purpose: platform tooling and seeding}
  WH_LOADING:   {size: XSMALL, auto_suspend: 60, credit_quota: 20, purpose: Fivetran ingestion}
  WH_TRANSFORM: {size: XSMALL, auto_suspend: 60, credit_quota: 30, purpose: Airflow transforms}
  WH_ANALYTICS: {size: XSMALL, auto_suspend: 60, credit_quota: 20, purpose: analysts and Hex}

databases:
  RAW:
    comment: Landing zone written by ingestion tools only
    schemas:
      FIVETRAN_PG:      {owner_team: data-platform, sensitivity: restricted}
      FIVETRAN_STRIPE:  {owner_team: finance-eng,   sensitivity: restricted}
      INTERNAL_UPLOADS: {owner_team: data-platform, sensitivity: confidential}
  CURATED:
    comment: Cleaned and modelled source of truth
    schemas:
      EXPERTS:           {owner_team: talent,       sensitivity: confidential}
      EXPERTS_SENSITIVE: {owner_team: talent,       sensitivity: restricted}
      CUSTOMERS:         {owner_team: enterprise,   sensitivity: confidential}
      WORK:              {owner_team: operations,   sensitivity: internal}
      PAYMENTS:          {owner_team: finance-eng,  sensitivity: restricted}
  MARTS:
    comment: Team-facing aggregates read by dashboards
    schemas:
      GROWTH:  {owner_team: growth,  sensitivity: internal}
      FINANCE: {owner_team: finance, sensitivity: confidential}
      ML:      {owner_team: ml,      sensitivity: confidential}
      EXEC:    {owner_team: data-platform, sensitivity: internal}
  GOVERNANCE:
    comment: Tags, policies, entitlements, audit
    schemas:
      TAGS:         {owner_team: data-platform, sensitivity: internal}
      POLICIES:     {owner_team: data-platform, sensitivity: internal}
      ENTITLEMENTS: {owner_team: data-platform, sensitivity: confidential}
      AUDIT:        {owner_team: data-platform, sensitivity: confidential}
  PLATFORM:
    comment: Platform tooling state
    schemas:
      OPS:  {owner_team: data-platform, sensitivity: internal}
      COST: {owner_team: data-platform, sensitivity: internal}

functional_roles:
  FR_DATA_ANALYST:
    comment: Analysts; no PII, read-only
    read: [CURATED.WORK, CURATED.CUSTOMERS, CURATED.EXPERTS, MARTS.GROWTH, MARTS.EXEC]
    warehouses: [WH_ANALYTICS]
  FR_DATA_SCIENTIST:
    comment: ML; reads work and expert data, writes ML marts
    read: [CURATED.WORK, CURATED.EXPERTS]
    write: [MARTS.ML]
    warehouses: [WH_ANALYTICS]
  FR_FINANCE:
    comment: Finance; payments and customer contracts
    read: [CURATED.PAYMENTS, CURATED.CUSTOMERS]
    write: [MARTS.FINANCE]
    warehouses: [WH_ANALYTICS]
  FR_SUPPORT:
    comment: Expert support
    read: [CURATED.EXPERTS, CURATED.WORK]
    warehouses: [WH_ANALYTICS]
  FR_PII_READER:
    comment: Additive; unmasks and reads restricted expert data
    read: [CURATED.EXPERTS_SENSITIVE]
    warehouses: [WH_ANALYTICS]
  FR_DATA_PLATFORM:
    comment: Platform engineers; manage policies and tooling, no data access by default
    read: [GOVERNANCE.*]
    write: [PLATFORM.*]
    warehouses: [WH_ADMIN]

service_roles:
  SVC_FIVETRAN:
    comment: Fivetran connectors
    write: [RAW.FIVETRAN_PG, RAW.FIVETRAN_STRIPE]
    warehouses: [WH_LOADING]
  SVC_AIRFLOW:
    comment: Airflow transforms raw into curated and marts
    read: [RAW.*]
    write: [CURATED.*, MARTS.*]
    warehouses: [WH_TRANSFORM]
  SVC_HEX:
    comment: Hex dashboards read marts only
    read: [MARTS.*]
    warehouses: [WH_ANALYTICS]

# Phase 3: tag-driven masking and row access. One tag (GOVERNANCE.TAGS.DATA_CLASS) is put on
# columns; one masking policy per data type is attached to the tag, so tagging a column is the
# only step needed to protect it. `unmask` roles see real values (checked with IS_ROLE_IN_SESSION).
# SVC_AIRFLOW unmasks everything because transforms must read true values.
governance:
  tag: GOVERNANCE.TAGS.DATA_CLASS
  classes:
    GENERAL:       {mask: false}
    PII_DIRECT:    {unmask: [FR_SUPPORT, FR_PII_READER, SVC_AIRFLOW]}
    PII_SENSITIVE: {unmask: [FR_PII_READER, SVC_AIRFLOW]}
    FINANCIAL:     {unmask: [FR_FINANCE, SVC_AIRFLOW]}
  columns:
    CURATED.EXPERTS.EXPERTS:
      EXPERT_ID: GENERAL
      EMAIL: PII_DIRECT
      FULL_NAME: PII_DIRECT
      COUNTRY: GENERAL
      DOMAIN: GENERAL
      HOURLY_RATE_USD: FINANCIAL
      STATUS: GENERAL
      SIGNED_UP_AT: GENERAL
    CURATED.EXPERTS_SENSITIVE.EXPERT_PII:
      EXPERT_ID: GENERAL
      TAX_ID: PII_SENSITIVE
      PHONE: PII_SENSITIVE
      STREET_ADDRESS: PII_SENSITIVE
      DATE_OF_BIRTH: PII_SENSITIVE
    CURATED.CUSTOMERS.CUSTOMERS:
      CUSTOMER_ID: GENERAL
      NAME: GENERAL
      TIER: GENERAL
      CONTRACT_VALUE_USD: FINANCIAL
      REGION: GENERAL
    CURATED.PAYMENTS.PAYMENTS:
      PAYMENT_ID: GENERAL
      EXPERT_ID: GENERAL
      TASK_ID: GENERAL
      AMOUNT_USD: FINANCIAL
      PAID_AT: GENERAL
      METHOD: GENERAL
  # Row filtering is not tag-based (Snowflake attaches these per table). Roles not listed see no rows.
  row_access:
    CURATED.CUSTOMERS.CUSTOMERS:
      column: REGION
      unrestricted: [FR_FINANCE, SVC_AIRFLOW]
      regions: {FR_DATA_ANALYST: [NA, EMEA]}

# Phase 4: access follows people. The HR feed is the only input; users hold functional roles
# derived from job_family plus time-boxed exceptions. Exceptions are the only way to get an
# additive role like FR_PII_READER, and they expire on their own.
hr_sync:
  max_disable_fraction: 0.25   # abort if one run would disable more than this share of managed users
  job_family_roles:
    Analytics:         [FR_DATA_ANALYST]
    Machine Learning:  [FR_DATA_SCIENTIST]
    Finance:           [FR_FINANCE]
    Talent Support:    [FR_SUPPORT]
    Data Platform:     [FR_DATA_PLATFORM]
    Engineering:       []
    Executive:         [FR_DATA_ANALYST]
  exceptions:
    - {employee: noor.haddad@example.com, role: FR_PII_READER, expires: 2026-12-31, reason: "1099 reconciliation, ticket SEC-142"}
    - {employee: mei.chen@example.com,    role: FR_PII_READER, expires: 2026-09-30, reason: "Audit sample, ticket SEC-097"}
