[project]
name = "data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["snowflake-connector-python>=3.12", "python-dotenv", "cryptography", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]   # long SQL strings; no formatter enforces width

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E702"]   # demo scripts favour terse one-liners
